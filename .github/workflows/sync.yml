name: Sync Upstream & Patch

on:
  schedule:
    - cron: "30 23 * * *" # Daily 23:30 UTC = 07:30 Asia/Shanghai (UTC+8)
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even without version change"
        type: boolean
        default: false

env:
  NODE_VERSION: "24"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.detect.outputs.has_update }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check upstream versions
        id: detect
        run: |
          # Manual dispatch with force=true always builds.
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Force build requested — skipping version check."
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --force here only makes the script always emit JSON (exit 0);
          # the real "did it change?" comparison is done below against
          # the last-built version recorded in package.json. This avoids
          # relying on scripts/.versions.json, which is gitignored and
          # therefore always empty in CI.
          # Windows-only build → compare against the Windows upstream version.
          RESULT=$(node scripts/check-update.js --json --force)
          UPSTREAM=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const p=JSON.parse(d).platforms||{};console.log(p.Windows?.version||'')}catch{console.log('')}})")
          CURRENT=$(node -e "console.log(require('./package.json').version)")

          echo "Upstream latest : ${UPSTREAM:-<unknown>}"
          echo "Current build   : ${CURRENT}"

          if [ -z "$UPSTREAM" ]; then
            echo "::warning::Could not determine upstream version; skipping build."
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          elif [ "$UPSTREAM" != "$CURRENT" ]; then
            echo "New upstream version detected → build."
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date → skip build."
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────
  # Windows only. mac/linux builds removed:
  #   - build-mac: build-from-upstream.js looks for Codex.app but the
  #     upstream ZIP ships ChatGPT.app — never built successfully.
  #   - build-linux: better-sqlite3 fails to compile against Electron 42.
  # ──────────────────────────────────────────────
  build-windows:
    needs: check
    if: needs.check.outputs.has_update == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Install tools
        run: |
          choco install 7zip -y

      - name: Add 7zz alias
        run: |
          Copy-Item "C:\Program Files\7-Zip\7z.exe" "C:\Program Files\7-Zip\7zz.exe"
          echo "C:\Program Files\7-Zip" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Sync upstream (Windows only)
        run: node scripts/sync-upstream.js --force --skip-mac

      # Name the build output after the upstream Windows version being
      # packaged, not the version recorded by the previous release.
      - name: Align package version with upstream
        shell: bash
        run: |
          RESULT=$(node scripts/check-update.js --json --force)
          VER=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).platforms?.Windows?.version||'')}catch{console.log('')}})")
          if [ -n "$VER" ]; then
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='$VER';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
            echo "package.json version -> $VER"
          else
            echo "::warning::Could not resolve upstream Windows version; keeping $(node -e "console.log(require('./package.json').version)")"
          fi

      - name: Patch
        run: node scripts/patch-all.js win

      - name: Build
        run: npm run build:win-x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Codex-Windows-x64
          path: out/*.zip
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Bump version + tag + release
  # ──────────────────────────────────────────────
  release:
    needs: [check, build-windows]
    if: always() && needs.check.outputs.has_update == 'true' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Get upstream version and tag
        id: version
        run: |
          RESULT=$(node scripts/check-update.js --json --force)
          WIN_VER=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.platforms?.Windows?.version||'')}catch{console.log('')}})")

          VERSION="$WIN_VER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "win_version=$WIN_VER" >> "$GITHUB_OUTPUT"

          if [ -z "$VERSION" ]; then echo "No version detected"; exit 0; fi

          node -e "
            const fs=require('fs'), p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.version='$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json
          if git diff --cached --quiet; then
            echo "No version change — package.json already at ${VERSION}."
          else
            git commit -m "Bump version to ${VERSION}"
            # master may have moved since checkout — rebase before pushing.
            git pull --rebase origin master
            git push origin HEAD
          fi

          # Re-runs must not fail on an existing tag.
          if git ls-remote --exit-code --tags origin "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — skipping tag creation."
          else
            git tag -a "v${VERSION}" -m "Codex ${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Display structure
        run: ls -lhR artifacts/

      - name: Create Release
        if: steps.version.outputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Codex ${{ steps.version.outputs.version }}
          body: |
            ## Upstream Versions
            | Platform | Version |
            |----------|---------|
            | Windows x64 | `${{ steps.version.outputs.win_version || 'N/A' }}` |
          files: |
            artifacts/**/*.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
